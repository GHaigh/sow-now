; ─────────────────────────────────────────────────────────────────────────────
; Sow Now Sensor Node — PlatformIO configuration
;
; Target MCU : ATtiny85 @ 8 MHz (internal RC, 3.3V)
; Programmer : USBasp (for production flashing)
;              Arduino as ISP works too — change upload_protocol below
; ─────────────────────────────────────────────────────────────────────────────

[platformio]
default_envs = attiny85

; ── Production (USBasp programmer) ───────────────────────────────────────────
[env:attiny85]
platform      = atmelavr
board         = attiny85
framework     = arduino

; 8 MHz internal oscillator — cost-optimised, no external crystal needed
board_build.f_cpu = 8000000L

; Fuse bytes: LFUSE=0xE2 (8MHz RC, no divider), HFUSE=0xD7 (SPIEN, no WDT),
;             EFUSE=0xFF
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xD7
board_fuses.efuse = 0xFF

upload_protocol = usbasp
upload_flags    = -Pusb

; Libraries used (vendored locally to fit in 8KB flash budget)
lib_deps =
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^3.11.0

; Aggressive size optimisation — critical on 8KB flash
build_flags =
  -Os
  -DNDEBUG
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

; ── Dev/debug with Arduino Uno as ISP ────────────────────────────────────────
[env:attiny85_isp]
extends         = env:attiny85
upload_protocol = stk500v1
upload_port     = /dev/cu.usbmodem*
upload_speed    = 19200
upload_flags    = -P$UPLOAD_PORT -b19200
