# dnsmasq configuration for Sow Now captive portal
# Runs only during WiFi setup — stopped once hub joins home network

# Bind to the AP interface only
interface=wlan0
bind-interfaces

# DHCP pool — hand out addresses in 192.168.4.x range
dhcp-range=192.168.4.2,192.168.4.20,255.255.255.0,24h

# Redirect ALL DNS queries to this device (captive portal redirect)
# Customer's phone will hit 192.168.4.1 for every hostname → triggers portal
address=/#/192.168.4.1

# Don't read /etc/resolv.conf — we're offline, there's no upstream DNS
no-resolv

# Don't forward short hostnames upstream
domain-needed
bogus-priv
