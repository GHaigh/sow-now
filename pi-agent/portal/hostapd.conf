# hostapd configuration for Sow Now captive portal
# Used on Pi Zero W (CYW43438 chipset) — AP mode only (no concurrent STA)

interface=wlan0
driver=nl80211

# SSID is set dynamically by portal.py using the device serial suffix
# This file is a template — portal.py writes the final hostapd.conf at runtime
ssid=SowNow-Setup

hw_mode=g
channel=6
ieee80211n=1

# No authentication — open network so the customer's phone connects automatically
auth_algs=1
wpa=0

# Country code — UK
country_code=GB
ieee80211d=1
